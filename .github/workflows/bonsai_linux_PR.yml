name: bonsai_linux_PR

on:
  workflow_dispatch:
    inputs:
      alpha_date:
        description: 'Date to base the alpha release on (format: yymmdd)'
        required: false
        default: '250910'

jobs:
  build-linux-py311:
    runs-on: ubuntu-latest
    name: Linux Build - py311

    steps:
      - uses: actions/checkout@v2

      - name: Setup Python 3.11
        uses: actions/setup-python@v2
        with:
          python-version: '3.11'
          architecture: 'x64'

      - name: Get current version
        id: version
        run: echo "version=$(cat VERSION)" >> $GITHUB_OUTPUT

      - name: Get time suffix (hhmm)
        id: time
        run: echo "hhmm=$(date +'%H%M')" >> $GITHUB_OUTPUT

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install wheel setuptools

      - name: Show build environment info
        run: |
          echo "Build environment:"
          echo "Python version: $(python --version)"
          echo "Pip version: $(pip --version)"
          echo "GCC version: $(gcc --version | head -1)"
          echo "Glibc version: $(ldd --version | head -1)"
          uname -a

      - name: Compile Bonsai (Linux, py311)
        run: |
          cd src/bonsai
          make dist PLATFORM=linux PYVERSION=py311

      - name: Verify build output
        run: |
          ls -la src/bonsai/dist/
          echo "Checking for zip files..."
          if ls src/bonsai/dist/bonsai_*.zip 1> /dev/null 2>&1; then
            echo "✓ Bonsai zip file found"
          else
            echo "✗ No Bonsai zip file found"
            exit 1
          fi

      - name: Extract and verify addon structure
        run: |
          cd src/bonsai/dist
          zipfile=$(ls bonsai_*.zip | head -1)
          echo "Extracting $zipfile for verification..."
          unzip -q "$zipfile" -d temp_extract/
          
          echo "Checking addon structure..."
          if [ -d "temp_extract/bonsai" ]; then
            echo "✓ Bonsai addon directory found"
          else
            echo "✗ Bonsai addon directory missing"
            exit 1
          fi
          
          echo "Checking for __init__.py..."
          if [ -f "temp_extract/bonsai/__init__.py" ]; then
            echo "✓ Main __init__.py found"
          else
            echo "✗ Main __init__.py missing"
            exit 1
          fi
          
          echo "Checking for IfcOpenShell dependencies..."
          if [ -d "temp_extract/bonsai/libs" ]; then
            echo "✓ Libs directory found"
            ls -la temp_extract/bonsai/libs/
          elif [ -d "temp_extract/bonsai/wheels" ]; then
            echo "✓ Wheels directory found (preferred packaging method)"
            echo "IfcOpenShell wheels included:"
            ls -la temp_extract/bonsai/wheels/ | grep -i ifcopenshell || echo "  No IfcOpenShell wheels found"
          else
            echo "⚠ No libs or wheels directory found - checking for ifcopenshell in other locations"
          fi
          
          # Check if ifcopenshell wheels are bundled
          echo "Searching for IfcOpenShell packages..."
          ifcopenshell_files=$(find temp_extract/ -name "*ifcopenshell*" -type f)
          if [ -n "$ifcopenshell_files" ]; then
            echo "✓ IfcOpenShell packages found:"
            echo "$ifcopenshell_files"
          else
            echo "✗ No IfcOpenShell packages found in addon"
            exit 1
          fi
          
          # Verify the wheel is the correct version and platform
          wheel_file=$(find temp_extract/ -name "ifcopenshell-*.whl" | head -1)
          if [ -n "$wheel_file" ]; then
            echo "✓ IfcOpenShell wheel details:"
            basename "$wheel_file"
            # Extract version info from filename
            wheel_name=$(basename "$wheel_file")
            if [[ "$wheel_name" =~ py311.*linux ]]; then
              echo "✓ Wheel matches expected platform (py311, linux)"
            else
              echo "⚠ Wheel platform might not match expected (py311, linux): $wheel_name"
            fi
            
            # Check wheel compatibility tags using bash string manipulation
            echo "Wheel compatibility details:"
            IFS='-' read -ra PARTS <<< "${wheel_name%.whl}"
            if [ ${#PARTS[@]} -ge 5 ]; then
              echo "  Package: ${PARTS[0]}"
              echo "  Version: ${PARTS[1]}"
              echo "  Python: ${PARTS[2]}"
              echo "  ABI: ${PARTS[3]}"
              echo "  Platform: ${PARTS[4]}"
            fi
          fi

      - name: Test IfcOpenShell wheel installation
        run: |
          cd src/bonsai/dist/temp_extract
          wheel_file=$(find . -name "ifcopenshell-*.whl" | head -1)
          if [ -n "$wheel_file" ]; then
            echo "Testing IfcOpenShell wheel installation..."
            # Create a test environment
            python -m venv test_env
            source test_env/bin/activate
            
            # Install the wheel
            pip install "$wheel_file"
            
            # Create test script
            cat > test_ifcopenshell.py << 'PYTHON_SCRIPT'
try:
    import ifcopenshell
    print("✓ IfcOpenShell imports successfully")
    print("  Version:", ifcopenshell.version)
    print("  File location:", ifcopenshell.__file__)
    
    # Test basic functionality (without opening files)
    from ifcopenshell import entity_instance
    print("✓ Basic IfcOpenShell classes accessible")
    
except ImportError as e:
    print("✗ Failed to import IfcOpenShell:", str(e))
    exit(1)
except Exception as e:
    print("⚠ IfcOpenShell imported but with issues:", str(e))
PYTHON_SCRIPT
            
            # Run the test
            python test_ifcopenshell.py
            
            deactivate
            rm -rf test_env test_ifcopenshell.py
          else
            echo "⚠ No IfcOpenShell wheel found for testing"
          fi

      - name: Test addon import (basic validation)
        run: |
          cd src/bonsai/dist
          zipfile=$(ls bonsai_*.zip | head -1)
          unzip -q "$zipfile" -d test_import/
          
          # Add the extracted addon to Python path and test basic import
          export PYTHONPATH="$PWD/test_import:$PYTHONPATH"
          
          echo "Testing basic addon structure..."
          
          # Create test script
          cat > test_bonsai.py << 'PYTHON_SCRIPT'
import sys
sys.path.insert(0, 'test_import')

try:
    # Test if we can at least import the addon structure
    import bonsai
    print("✓ Bonsai addon imports successfully")
    
    # Check if bl_info exists
    if hasattr(bonsai, 'bl_info'):
        print("✓ bl_info found in addon")
        print("  Name:", bonsai.bl_info.get("name", "Unknown"))
        print("  Version:", bonsai.bl_info.get("version", "Unknown"))
    else:
        print("⚠ bl_info not found - this might be expected for some addon structures")

except ImportError as e:
    print("⚠ Could not import bonsai addon:", str(e))
    print("This might be expected if the addon requires Blender context")
except Exception as e:
    print("⚠ Error during addon validation:", str(e))
PYTHON_SCRIPT
          
          # Run the test
          python test_bonsai.py
          rm test_bonsai.py

      - name: Find zip file
        id: find_zip
        run: |
          filepath=$(ls src/bonsai/dist/bonsai_*.zip)
          echo "filepath=$filepath" >> $GITHUB_OUTPUT
          echo "filename=$(basename $filepath)" >> $GITHUB_OUTPUT
          
          # Get file size for verification
          filesize=$(stat -c%s "$filepath")
          echo "filesize=$filesize" >> $GITHUB_OUTPUT
          echo "File size: $(( filesize / 1024 / 1024 )) MB"

      - name: Upload release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ steps.find_zip.outputs.filepath }}
          asset_name: ${{ steps.find_zip.outputs.filename }}
          release_name: "bonsai-${{ steps.version.outputs.version }}-alpha${{ github.event.inputs.alpha_date }}${{ steps.time.outputs.hhmm }} (unstable)"
          tag: "bonsai-${{ steps.version.outputs.version }}-alpha${{ github.event.inputs.alpha_date }}${{ steps.time.outputs.hhmm }}"
          overwrite: true
          body: |
            Manual Bonsai build for Linux (py311) based on alpha date ${{ github.event.inputs.alpha_date }}.
            
            **Build Info:**
            - Platform: Linux x86_64
            - Python: 3.11
            - File size: ${{ steps.find_zip.outputs.filesize }} bytes ($(( ${{ steps.find_zip.outputs.filesize }} / 1024 / 1024 )) MB)
            - Build time: ${{ steps.time.outputs.hhmm }}
            - Compatible with: Ubuntu 20.04+ (glibc 2.31+)
            
            **Installation:**
            1. Download the zip file
            2. In Blender, go to Edit > Preferences > Add-ons
            3. Click "Install..." and select this zip file
            4. Enable the "Import-Export: BlenderBIM Add-on" addon
            
            **Known Issues:**
            - If you experience crashes when opening IFC files, try using a different Blender version or IfcOpenShell build
            - This build includes IfcOpenShell wheels optimized for the GitHub Actions build environment

      - name: Cleanup
        if: always()
        run: |
          cd src/bonsai/dist
          rm -rf temp_extract/ test_import/ 2>/dev/null || true
