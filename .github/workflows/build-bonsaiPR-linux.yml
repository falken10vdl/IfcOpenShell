name: Build BonsaiPR Addon (Linux)

on:
  schedule:
    - cron: '0 3 * * *'  # Todos los días a las 03:00 UTC
  workflow_dispatch:     # Permite ejecución manual

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tu repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Necesario para merge de PRs

      - name: Configura Git
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

      - name: Agrega upstream del repo oficial
        run: |
          git remote add upstream https://github.com/IfcOpenShell/IfcOpenShell.git
          git fetch upstream

      - name: Detectar rama principal
        id: main_branch
        run: |
          MAIN_BRANCH=$(git remote show origin | grep 'HEAD branch' | cut -d':' -f2 | tr -d ' ')
          echo "Rama principal detectada: $MAIN_BRANCH"
          echo "MAIN_BRANCH=$MAIN_BRANCH" >> $GITHUB_ENV

      - name: Checkout rama principal
        run: git checkout $MAIN_BRANCH

      - name: Instala GitHub CLI
        run: |
          sudo apt update && sudo apt install -y gh
          gh version

      - name: Autenticarse en GH CLI
        run: gh auth status || gh auth login --with-token <<< "${{ secrets.GITHUB_TOKEN }}"

      - name: Merge de todos los PRs abiertos
        run: |
          gh pr list --repo IfcOpenShell/IfcOpenShell --state open --json number --jq '.[].number' | while read pr; do
            echo "Mergeando PR #$pr"
            git fetch upstream pull/$pr/head:pr-$pr
            git merge --no-ff --no-edit pr-$pr || echo "Conflicto en PR #$pr, se ignorará"
          done

      - name: Empaquetar addon Bonsai como .zip
        run: |
          mkdir -p build/bonsai
          cp -r src/bonsai/bonsai/* build/bonsai/
          cd build
          zip -r bonsai-linux.zip bonsai

      - name: Crear Release y subir addon
        uses: softprops/action-gh-release@v1
        with:
          tag_name: daily-bonsai-build
          name: "Daily Bonsai Build"
          files: build/bonsai-linux.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
