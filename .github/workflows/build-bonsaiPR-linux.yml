name: Build BonsaiPR Addon

on:
  schedule:
    - cron: '0 3 * * *'  # Daily at 03:00 UTC
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Select platforms to build (comma-separated: linux,windows,macos)'
        required: true
        default: linux

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [${{ fromJSON('["' + join(split(github.event.inputs.platforms, ","), '","') + '"]') }}]

    steps:
      # 1️⃣ Checkout your fork
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      # 2️⃣ Configure Git
      - name: Configure Git
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

      # 3️⃣ Install GitHub CLI
      - name: Install GitHub CLI
        run: sudo apt install -y gh

      - name: Authenticate GitHub CLI
        run: gh auth status || gh auth login --with-token <<< "${{ secrets.GITHUB_TOKEN }}"

      # 4️⃣ Merge PRs from allowed owners
      - name: Merge PRs from allowed owners
        id: merge_prs
        run: |
          ALLOWED_OWNERS="falken10vdl"
          git remote add upstream https://github.com/IfcOpenShell/IfcOpenShell.git
          git fetch upstream
          MAIN_BRANCH=$(git remote show origin | grep 'HEAD branch' | cut -d':' -f2 | tr -d ' ')
          git checkout $MAIN_BRANCH
          merged_prs=""
          for owner in $ALLOWED_OWNERS; do
            gh pr list --repo IfcOpenShell/IfcOpenShell --state open --author $owner --json number --jq '.[].number' | while read pr; do
              echo "Merging PR #$pr from $owner"
              git fetch upstream pull/$pr/head:pr-$pr
              if git merge --no-ff --no-edit pr-$pr; then
                merged_prs="$merged_prs #$pr"
              else
                echo "Conflict in PR #$pr, skipping"
              fi
            done
          done
          echo "merged_prs=$merged_prs" >> $GITHUB_OUTPUT
          echo "pr_owners=$ALLOWED_OWNERS" >> $GITHUB_OUTPUT

      # 5️⃣ Install Linux build dependencies
      - name: Install build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt update
          sudo apt install -y gcc g++ git make zip libffi-dev \
                              libgl1-mesa-dev libsqlite3-dev zlib1g-dev \
                              libbz2-dev libssl-dev libreadline-dev libncurses-dev xz-utils
          python3 -m pip install --upgrade pip
          python3 -m pip install typing_extensions

      # 6️⃣ Setup Python 3.11
      - name: Setup Python 3.11
        if: matrix.platform == 'linux'
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      # 7️⃣ Get version and date for release tag
      - name: Get current version
        id: version
        run: echo "version=$(cat VERSION)" >> $GITHUB_OUTPUT
      - name: Get current date
        id: date
        run: echo "date=$(date +'%y%m%d%H%M')" >> $GITHUB_OUTPUT

      # 8️⃣ Build Bonsai
      - name: Build BonsaiPR
        if: matrix.platform == 'linux'
        run: |
          cd src/bonsai
          rm -rf build dist
          mkdir -p build dist
          cp -r bonsai build/bonsaiPR
          cd build && python3 -m venv env && . env/bin/activate && pip install build
          cd ..
          make dist PLATFORM=linux PYVERSION=py311 ADDON_NAME=bonsaiPR || true

      # 9️⃣ Find and rename zip with owner-based prefix
      - name: Find and rename zip
        if: matrix.platform == 'linux'
        id: find_zip
        run: |
          original=$(ls src/bonsai/dist/bonsai_*.zip)
          echo "Original zip: $original"
          owners="${{ steps.merge_prs.outputs.pr_owners }}"
          owners_clean=$(echo "$owners" | tr ' ' '_' | tr ',' '_')
          
          # Carpeta de destino
          dest_dir=$(dirname "$original" | sed "s|bonsai|bonsaiPR_${owners_clean}|")
          mkdir -p "$dest_dir"

          # Nuevo archivo
          newfile="$dest_dir/$(basename "$original")"
          cp "$original" "$newfile"

          echo "filepath=$newfile" >> $GITHUB_OUTPUT
          echo "filename=$(basename $newfile)" >> $GITHUB_OUTPUT

      # 🔟 Upload zip to GitHub release
      - name: Upload zip to release
        if: matrix.platform == 'linux'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ steps.find_zip.outputs.filepath }}
          asset_name: ${{ steps.find_zip.outputs.filename }}
          release_name: "bonsaiPR-${{steps.version.outputs.version}}-alpha${{steps.date.outputs.date}} (unstable)"
          tag: "bonsaiPR-${{steps.version.outputs.version}}-alpha${{steps.date.outputs.date}}"
          overwrite: true
          body: |
            Daily BonsaiPR build including all open PRs from: ${{ steps.merge_prs.outputs.pr_owners }}
            Merged PRs: ${{ steps.merge_prs.outputs.merged_prs }}
