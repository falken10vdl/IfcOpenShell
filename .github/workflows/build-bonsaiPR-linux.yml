name: Build BonsaiPR Addon (Linux)

on:
  schedule:
    - cron: '0 3 * * *'  # Daily at 03:00 UTC
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout your fork
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      # 2️⃣ Configure Git
      - name: Configure Git
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

      # 3️⃣ Install GitHub CLI
      - name: Install GitHub CLI
        run: sudo apt install -y gh

      - name: Authenticate GitHub CLI
        run: gh auth status || gh auth login --with-token <<< "${{ secrets.GITHUB_TOKEN }}"

      # 4️⃣ Merge all open PRs from upstream
      - name: Merge all open PRs from upstream
        run: |
          git remote add upstream https://github.com/IfcOpenShell/IfcOpenShell.git
          git fetch upstream
          MAIN_BRANCH=$(git remote show origin | grep 'HEAD branch' | cut -d':' -f2 | tr -d ' ')
          git checkout $MAIN_BRANCH
          gh pr list --repo IfcOpenShell/IfcOpenShell --state open --json number --jq '.[].number' | while read pr; do
            echo "Merging PR #$pr"
            git fetch upstream pull/$pr/head:pr-$pr
            git merge --no-ff --no-edit pr-$pr || echo "Conflict in PR #$pr, skipping"
          done

      # 5️⃣ Install Linux build dependencies
      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y gcc g++ git make zip libffi-dev \
                              libgl1-mesa-dev libsqlite3-dev zlib1g-dev \
                              libbz2-dev libssl-dev libreadline-dev libncurses-dev xz-utils
          python3 -m pip install --upgrade pip
          python3 -m pip install typing_extensions

      # 6️⃣ Setup Python 3.11
      - name: Setup Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      # 7️⃣ Get version and date for release tag
      - name: Get current version
        id: version
        run: echo "version=$(cat VERSION)" >> $GITHUB_OUTPUT
      - name: Get current date
        id: date
        run: echo "date=$(date +'%y%m%d%H%M')" >> $GITHUB_OUTPUT

      # 8️⃣ Build Bonsai for Linux
      - name: Build Bonsai
        run: |
          cd src/bonsai
          make dist PLATFORM=linux PYVERSION=py311

      # 9️⃣ Find the generated zip
      - name: Find zip file
        id: find_zip
        run: |
          filepath=$(ls src/bonsai/dist/bonsai_*.zip)
          echo "filepath=$filepath" >> $GITHUB_OUTPUT
          echo "filename=$(basename $filepath)" >> $GITHUB_OUTPUT

      # 🔟 Upload zip to GitHub release
      - name: Upload zip to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ steps.find_zip.outputs.filepath }}
          asset_name: ${{ steps.find_zip.outputs.filename }}
          release_name: "bonsai-${{steps.version.outputs.version}}-alpha${{steps.date.outputs.date}} (unstable)"
          tag: "bonsai-${{steps.version.outputs.version}}-alpha${{steps.date.outputs.date}}"
          overwrite: true
          body: "Daily Bonsai build including all open PRs from IfcOpenShell/IfcOpenShell."
