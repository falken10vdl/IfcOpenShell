name: Build BonsaiPR Addon

on:
  schedule:
    - cron: '0 3 * * *'  # Daily at 03:00 UTC
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Comma-separated platforms to build (linux,windows,macos)'
        required: true
        default: 'linux'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      PLATFORMS: ${{ github.event.inputs.platforms }}
    steps:
      # 1️⃣ Skip platform if not selected
      - name: Skip platform if not selected
        if: ${{ !contains(env.PLATFORMS, matrix.os == 'ubuntu-latest' && 'linux' || matrix.os == 'macos-latest' && 'macos' || matrix.os == 'windows-latest' && 'windows') }}
        run: |
          echo "Platform ${{ matrix.os }} not selected, skipping..."
          exit 0

      # 2️⃣ Checkout your fork
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      # 3️⃣ Configure Git
      - name: Configure Git
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

      # 4️⃣ Install GitHub CLI
      - name: Install GitHub CLI
        if: runner.os == 'Linux'
        run: sudo apt install -y gh

      - name: Authenticate GitHub CLI
        if: runner.os == 'Linux'
        run: gh auth status || gh auth login --with-token <<< "${{ secrets.GITHUB_TOKEN }}"

      # 5️⃣ Merge PRs from allowed owners (Linux only for now)
      - name: Merge PRs from allowed owners
        id: merge_prs
        if: runner.os == 'Linux'
        run: |
          ALLOWED_OWNERS="falken10vdl"
          git remote add upstream https://github.com/IfcOpenShell/IfcOpenShell.git
          git fetch upstream
          MAIN_BRANCH=$(git remote show origin | grep 'HEAD branch' | cut -d':' -f2 | tr -d ' ')
          git checkout $MAIN_BRANCH
          merged_prs=""
          for owner in $ALLOWED_OWNERS; do
            gh pr list --repo IfcOpenShell/IfcOpenShell --state open --author $owner --json number --jq '.[].number' | while read pr; do
              echo "Merging PR #$pr from $owner"
              git fetch upstream pull/$pr/head:pr-$pr
              if git merge --no-ff --no-edit pr-$pr; then
                merged_prs="$merged_prs #$pr"
              else
                echo "Conflict in PR #$pr, skipping"
              fi
            done
          done
          echo "merged_prs=$merged_prs" >> $GITHUB_OUTPUT
          echo "pr_owners=$ALLOWED_OWNERS" >> $GITHUB_OUTPUT

      # 6️⃣ Install build dependencies (Linux only for now)
      - name: Install build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y gcc g++ git make zip libffi-dev \
                              libgl1-mesa-dev libsqlite3-dev zlib1g-dev \
                              libbz2-dev libssl-dev libreadline-dev libncurses-dev xz-utils
          python3 -m pip install --upgrade pip
          python3 -m pip install typing_extensions

      # 7️⃣ Setup Python 3.11 (Linux & macOS)
      - name: Setup Python 3.11
        if: runner.os != 'Windows'
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      # 8️⃣ Get version and date for release
      - name: Get current version
        id: version
        run: echo "version=$(cat VERSION)" >> $GITHUB_OUTPUT
      - name: Get current date
        id: date
        run: echo "date=$(date +'%y%m%d%H%M')" >> $GITHUB_OUTPUT

      # 9️⃣ Build Bonsai
      - name: Build BonsaiPR
        run: |
          echo "Building BonsaiPR for ${{ matrix.os }}..."
          cd src/bonsai
          rm -rf build dist
          mkdir -p build dist
          cp -r bonsai build/bonsaiPR
          if [[ "${{ matrix.os }}" != "windows-latest" ]]; then
            cd build && python3 -m venv env && . env/bin/activate && pip install build
            cd ..
          fi
          make dist PLATFORM=${{ matrix.os == 'ubuntu-latest' && 'linux' || matrix.os == 'macos-latest' && 'macos' || matrix.os == 'windows-latest' && 'windows' }} PYVERSION=py311 ADDON_NAME=bonsaiPR || true

      # 🔟 Find and rename zip with owner-based prefix
      - name: Find and rename zip
        id: find_zip
        run: |
          original=$(ls src/bonsai/dist/bonsai_*.zip)
          echo "Original zip: $original"
          owners="${{ steps.merge_prs.outputs.pr_owners }}"
          owners_clean=$(echo "$owners" | tr ' ' '_' | tr ',' '_')
          newfile=$(echo "$original" | sed "s/bonsai/bonsaiPR_${owners_clean}/")
          cp "$original" "$newfile"
          echo "filepath=$newfile" >> $GITHUB_OUTPUT
          echo "filename=$(basename $newfile)" >> $GITHUB_OUTPUT

      # 1️⃣1️⃣ Upload zip to GitHub release
      - name: Upload zip to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ steps.find_zip.outputs.filepath }}
          asset_name: ${{ steps.find_zip.outputs.filename }}
          release_name: "bonsaiPR-${{steps.version.outputs.version}}-alpha${{steps.date.outputs.date}} (unstable)"
          tag: "bonsaiPR-${{steps.version.outputs.version}}-alpha${{steps.date.outputs.date}}"
          overwrite: true
          body: |
            Daily BonsaiPR build including all open PRs from: ${{ steps.merge_prs.outputs.pr_owners }}
            Merged PRs: ${{ steps.merge_prs.outputs.merged_prs }}
